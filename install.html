<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0D0A06">
<title>和平鴿智慧體 · 安裝</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@700;900&family=Noto+Sans+TC:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--gold:#D4AF6A;--gold-d:#8B6914;--bg0:#050402;--bg1:#0D0A06;--bg2:#111009;--line:#2A2018;--mid:#C4A55A;--lo:#8B7355;--dim:#6B5A3E;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans TC',sans-serif;background:var(--bg0);color:var(--mid);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 60% at 50% 30%,rgba(139,105,20,.08) 0%,transparent 60%)}
.top{width:100%;height:2px;position:fixed;top:0;left:0;background:linear-gradient(90deg,transparent,var(--gold-d),var(--gold),var(--gold-d),transparent)}
.logo{font-size:52px;margin-bottom:16px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
h1{font-family:'Noto Serif TC',serif;font-size:28px;color:var(--gold);letter-spacing:5px;margin-bottom:8px}
.sub{font-size:13px;color:var(--dim);letter-spacing:2px;margin-bottom:32px}
.div{width:100px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-d),transparent);margin:0 auto 32px}
.btn{display:block;width:100%;max-width:320px;margin:0 auto 14px;padding:18px;border-radius:14px;font-family:'Noto Serif TC',serif;font-size:18px;font-weight:700;letter-spacing:3px;text-decoration:none;transition:opacity .2s,transform .15s;position:relative;overflow:hidden}
.btn:active{opacity:.85;transform:scale(.98)}
.btn-ios{background:linear-gradient(135deg,var(--gold-d),var(--gold));color:#050402}
.btn-and{background:transparent;border:1px solid var(--gold-d);color:var(--gold)}
.hint{font-size:12px;color:var(--dim);letter-spacing:1px;margin-top:8px;line-height:1.7}
.hint strong{color:var(--mid)}
.steps{max-width:320px;margin:24px auto 0;text-align:left;display:none}
.steps.show{display:block}
.step-item{display:flex;gap:10px;padding:10px 0;border-bottom:.5px solid var(--line);font-size:14px;color:var(--lo);line-height:1.6;align-items:flex-start}
.step-item:last-child{border-bottom:none}
.sn{width:22px;height:22px;border-radius:50%;background:#2C1F0F;border:.5px solid var(--gold-d);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--gold);flex-shrink:0;margin-top:2px}
</style>
</head>
<body>
<div class="top"></div>
<div class="logo">🕊</div>
<h1>和平鴿智慧體</h1>
<div class="sub">PEACE DOVE INTELLIGENCE APP</div>
<div class="div"></div>

<a class="btn btn-ios" href="/index.html" onclick="showSteps('ios')">
  🍎 iPhone 安裝（iOS）
</a>
<a class="btn btn-and" href="/index.html" onclick="showSteps('and')">
  🤖 Android 安裝
</a>

<div class="hint">
  點擊後在瀏覽器中開啟 APP<br>
  再依下方步驟加入主畫面
</div>

<div class="steps" id="ios-steps">
  <div class="step-item"><div class="sn">1</div>APP 在 Safari 中開啟後，點選下方 <strong>分享（□↑）</strong></div>
  <div class="step-item"><div class="sn">2</div>選擇「<strong>加入主畫面</strong>」</div>
  <div class="step-item"><div class="sn">3</div>點選右上角「<strong>新增</strong>」</div>
  <div class="step-item"><div class="sn">4</div>主畫面出現 🕊 圖示，安裝完成 ✓</div>
</div>
<div class="steps" id="and-steps">
  <div class="step-item"><div class="sn">1</div>APP 在 Chrome 中開啟後，點選右上角 <strong>⋮ 選單</strong></div>
  <div class="step-item"><div class="sn">2</div>選擇「<strong>新增至主畫面</strong>」</div>
  <div class="step-item"><div class="sn">3</div>點選「<strong>新增</strong>」確認</div>
  <div class="step-item"><div class="sn">4</div>主畫面出現 🕊 圖示，安裝完成 ✓</div>
</div>

<script>
function showSteps(os){
  document.querySelectorAll('.steps').forEach(e=>e.classList.remove('show'));
  document.getElementById(os+'-steps').classList.add('show');
}
// Auto-detect OS
const ua = navigator.userAgent;
if(/iPad|iPhone|iPod/.test(ua)) showSteps('ios');
else if(/Android/.test(ua)) showSteps('and');
</script>
</body>
</html>
